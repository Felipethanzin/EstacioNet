<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Estácio Net</title>
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<script>
function abrirComentarios() {
    document.getElementById("comentarios").classList.add("ativo");
}

function fecharComentarios() {
    document.getElementById("comentarios").classList.remove("ativo");
}
</script>


</head>



<body>
<header class="header">
    
    <!-- LOGO -->
    <div class="logo">
        <img src="https://cdn-icons-png.flaticon.com/512/906/906175.png">
        <span>Estácio Net</span>
    </div>

<nav class="menu">
    <a href="#" class="active"><i class="bi bi-house"></i></a>
    <a href="#"><i class="bi bi-bar-chart"></i></a>
    <a href="#"><i class="bi bi-play-circle"></i></a>
    <a href="#"><i class="bi bi-cart"></i></a>
    <a href="#"><i class="bi bi-people"></i></a>
</nav>

<div class="actions">
    <span><i class="bi bi-grid"></i></span>
    <span><i class="bi bi-chat-dots"></i></span>
    <span><i class="bi bi-bell"></i></span>
    <img src="https://i.pravatar.cc/40" class="perfil">
</div>
</header>
<div class="feed">
    <div class="carrossel">

        <!-- POST 1 -->
        <div class="post">
            <img src="https://picsum.photos/400/600?1" class="post-img">

            <div class="topo-post">
                <img src="https://i.pravatar.cc/40?img=1" class="perfil-post">
                <span class="usuario">felipe_dev</span>
                <span class="tempo">• 5 min</span>
            </div>

            <div class="acoes-post">
                <i class="bi bi-heart"></i>
                <i class="bi bi-chat" onclick="abrirComentarios()"></i>
                <i class="bi bi-send"></i>
            </div>
        </div>

        <!-- POST 2 -->
        <div class="post">
            <img src="https://picsum.photos/400/600?2" class="post-img">

            <div class="topo-post">
                <img src="https://i.pravatar.cc/40?img=2" class="perfil-post">
                <span class="usuario">shoppingnovaiguacu</span>
                <span class="tempo">• 7 min</span>
            </div>

            <div class="acoes-post">
                <i class="bi bi-heart"></i>
                <i class="bi bi-chat" onclick="abrirComentarios()"></i>
                <i class="bi bi-send"></i>
            </div>
        </div>

        <!-- POST 3 -->
        <div class="post">
            <img src="https://picsum.photos/400/600?3" class="post-img">

            <div class="topo-post">
                <img src="https://i.pravatar.cc/40?img=3" class="perfil-post">
                <span class="usuario">tech_world</span>
                <span class="tempo">• 12 min</span>
            </div>

            <div class="acoes-post">
                <i class="bi bi-heart"></i>
                <i class="bi bi-chat" onclick="abrirComentarios()"></i>
                <i class="bi bi-send"></i>
            </div>
        </div>

    </div>
</div>


<!-- PAINEL DE COMENTÁRIOS -->
<div class="comentarios" id="comentarios">

    <div class="coment-header">
        <h3>Comentários</h3>
        <i class="bi bi-x-lg" onclick="fecharComentarios()"></i>
    </div>

    <div class="coment-lista">
        <div class="coment-item">
            <b>joao_dev</b>
            <p>Muito bom 🔥</p>
        </div>

        <div class="coment-item">
            <b>ana.tech</b>
            <p>Top demais 👏</p>
        </div>
    </div>

    <div class="coment-input">
        <input type="text" placeholder="Escreva um comentário...">
        <button>Enviar</button>
    </div>

</div>


</body>
</html>
