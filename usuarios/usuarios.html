<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pesquisar Usuários - Estácio Net</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="../css/usuarios.css">
</head>

<body>

<header class="header">

    <div class="logo">
        <img src="https://cdn-icons-png.flaticon.com/512/906/906175.png">
        <span>Estácio Net</span>
    </div>

    <nav class="menu">
        <a href="../home/home.html"><i class="bi bi-house"></i></a>
        <a href="../videos/videos.html"><i class="bi bi-play-circle"></i></a>
        <a href="../bate-papo/bate-papo.html"><i class="bi bi-chat-dots"></i></a>
        <a href="usuarios.html" class="active"><i class="bi bi-people"></i></a>
    </nav>

    <div class="actions">
        <div class="icon-btn">
            <i class="bi bi-bell"></i>
            <span class="badge">0</span>
        </div>

        <a href="../perfil/perfil.html">
            <img src="https://i.pravatar.cc/80?img=2" class="perfil">
        </a>
    </div>

</header>

<main>

    <div class="container">

        <div class="search-box">
            <i class="bi bi-search"></i>
            <input type="text" id="pesquisa" placeholder="Pesquisar usuários...">
        </div>

        <div class="usuarios" id="usuarios"></div>

        <p class="sem-resultado" id="semResultado">
            Nenhum usuário encontrado.
        </p>

    </div>

</main>

<script>
const API_URL = "https://ultrabuscax-1.onrender.com";

const pesquisa = document.getElementById("pesquisa");
const areaUsuarios = document.getElementById("usuarios");
const semResultado = document.getElementById("semResultado");

let listaUsuarios = [];

async function carregarUsuarios() {
    try {
        const resposta = await fetch(`${API_URL}/api/users`);

        const dados = await resposta.json();

        listaUsuarios = dados.data || [];

    } catch (erro) {
        console.error("Erro ao carregar usuários:", erro);
    }
}

function mostrarUsuarios(usuarios) {
    areaUsuarios.innerHTML = "";

    if (!usuarios || usuarios.length === 0) {
        semResultado.style.display = "block";
        return;
    }

    semResultado.style.display = "none";

    usuarios.forEach(usuario => {
        const foto = usuario.foto || `https://i.pravatar.cc/150?img=${usuario.id}`;

        const card = document.createElement("div");
        card.classList.add("usuario");

        card.innerHTML = `
            <div class="user-left">
                <img src="${foto}">
                <div class="user-info">
                    <strong>${usuario.nome}</strong>
                    <span>${usuario.email}</span>
                </div>
            </div>

            <button class="btn-chat">
                Mensagem
            </button>
        `;

        card.querySelector(".btn-chat").addEventListener("click", () => {
            abrirChat(usuario);
        });

        areaUsuarios.appendChild(card);
    });
}

pesquisa.addEventListener("input", () => {
    const texto = pesquisa.value.toLowerCase().trim();

    areaUsuarios.innerHTML = "";

    if (texto === "") {
        semResultado.style.display = "none";
        return;
    }

    const filtrados = listaUsuarios.filter(usuario => {
        const nome = String(usuario.nome || "").toLowerCase();
        const email = String(usuario.email || "").toLowerCase();

        return nome.includes(texto) || email.includes(texto);
    });

    mostrarUsuarios(filtrados);
});

async function abrirChat(usuario) {
    const token = localStorage.getItem("token");

    if (!token) {
        alert("Faça login primeiro. Token não encontrado.");
        return;
    }

    const resposta = await fetch(`${API_URL}/api/chat/conversas`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({
            usuarioId: usuario.id
        })
    });

    const dados = await resposta.json();

    console.log("RESPOSTA DA CONVERSA:", dados);

    if (!resposta.ok || !dados.success) {
        alert(dados.message || "Erro ao abrir conversa");
        return;
    }

    window.location.href =
        `../bate-papo/bate-papo.html?conversa=${dados.conversa.id}`;
}

carregarUsuarios();
</script>

</body>
</html>
