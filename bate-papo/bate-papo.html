<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estácio Net Chat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/bate.css">
</head>

<body>

    <header class="header">
        <div class="logo" onclick="location.reload()">
            <img src="https://cdn-icons-png.flaticon.com/512/906/906175.png">
            <span>Estácio Net</span>
        </div>

        <div class="home-container" onclick="window.location.href='../home/home.html'" title="Voltar ao Início" style="
display:flex;
align-items:center;
justify-content:center;
width:50px;
height:50px;
border-radius:50%;
background:#2a2b2c;
cursor:pointer;
transition:0.3s;
">

            <i class="bi bi-house-door-fill" style="font-size:26px; color:var(--text);"></i>

        </div>
    </header>
    <div class="chat-container">
        <div class="chat-list">
            <div class="user" onclick="abrirChat('eoonathan', 'https://i.pravatar.cc/40?img=1')">
                <img src="https://i.pravatar.cc/40?img=1">
                <div><span>eoonathan</span><br><small>Online</small></div>
            </div>
        </div>

        <div class="chat-box" id="chat">
            <div class="chat-header">
                <i class="bi bi-arrow-left" onclick="voltar()" style="cursor:pointer; font-size:24px;"></i>
                <img id="header-img" src="">
                <span id="nome" style="font-weight:bold; font-size:1.1rem;"></span>
            </div>
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <span id="timer">00:00</span>
                <input id="input" placeholder="Digite uma mensagem..." onkeypress="if(event.key==='Enter') enviar()">
                <div class="actions-btn">
                    <i class="bi bi-mic" id="mic" onclick="toggleRecord()"></i>
                    <i class="bi bi-image" onclick="document.getElementById('fileInput').click()"></i>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" hidden accept="image/*" onchange="uploadImg(event)">

    <script>
        let mediaRecorder, chunks = [], timerInterval;

        function abrirChat(u, img) {
            document.getElementById("chat").classList.add("active");
            document.getElementById("nome").innerText = u;
            document.getElementById("header-img").src = img;
        }
        function voltar() { document.getElementById("chat").classList.remove("active"); }

        function enviar() {
            let input = document.getElementById("input");
            if (!input.value.trim()) return;
            const div = document.createElement("div");
            div.className = "msg me";
            div.innerText = input.value;
            document.getElementById("messages").appendChild(div);
            input.value = "";
        }

        async function toggleRecord() {
            const mic = document.getElementById('mic');
            const timer = document.getElementById('timer');
            if (!mediaRecorder || mediaRecorder.state === "inactive") {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                chunks = [];
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    clearInterval(timerInterval);
                    timer.style.display = 'none';
                    const audioUrl = URL.createObjectURL(new Blob(chunks, { type: 'audio/webm' }));
                    const div = document.createElement("div");
                    div.className = "msg me audio-msg";
                    div.innerHTML = `
                    <div class="play-btn" onclick="this.querySelector('audio').play()"><i class="bi bi-play-fill"></i><audio src="${audioUrl}"></audio></div>
                    <span>Áudio Gravado</span>
                `;
                    document.getElementById("messages").appendChild(div);
                };
                mediaRecorder.start();
                timer.style.display = 'block';
                let s = 0;
                timerInterval = setInterval(() => { s++; timer.innerText = "00:" + (s < 10 ? "0" + s : s); }, 1000);
            } else {
                mediaRecorder.stop();
            }
        }

        function uploadImg(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const div = document.createElement("div");
                div.className = "msg me";
                div.innerHTML = `<img src="${ev.target.result}" style="width:100%; border-radius:15px;">`;
                document.getElementById("messages").appendChild(div);
            }
            reader.readAsDataURL(e.target.files[0]);
        }
    </script>
</body>

</html>
