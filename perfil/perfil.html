<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil</title>

<link rel="stylesheet" href="../css/perfil.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>

<header class="header">

    <div class="logo">
        <img src="https://cdn-icons-png.flaticon.com/512/906/906175.png">
        <span>Estácio Net</span>
    </div>

    <nav class="menu">
        <a href="../home/home.html" class="active">
            <i class="bi bi-house"></i>
        </a>

        <a href="#">
            <i class="bi bi-play-circle"></i>
        </a>

        <a href="../bate-papo/bate-papo.html">
            <i class="bi bi-chat-dots"></i>
        </a>

        <a href="../usuarios/usuarios.html">
            <i class="bi bi-people"></i>
        </a>
    </nav>

    <div class="actions">
        <a href="perfil.html" class="perfil-link">
            <img src="https://i.pravatar.cc/80?img=2" class="perfil">
        </a>
    </div>

</header>

<main>

<!-- BANNER -->
<div class="banner">
    <img src="https://picsum.photos/1200/300">
</div>

<!-- PERFIL -->
<div class="perfil-header">

<div class="foto-box">

<img src="https://i.pravatar.cc/120?img=2" id="fotoPerfil">

<label for="inputFoto" class="trocar-foto">
    <i class="bi bi-camera"></i>
</label>

<input type="file" id="inputFoto" hidden>

</div>

<div class="info">

<h2 id="nomePerfil">usuario</h2>

<span class="username">@usuario</span>

<p id="bioPerfil">Minha bio aqui...</p>

<div class="stats">
    <span><b>16</b> seguidores</span>
    <span><b>10</b> seguindo</span>
</div>

</div>

<button class="btn-editar" onclick="abrirEditor()">
    <i class="bi bi-pencil"></i> Editar perfil
</button>

</div>

<!-- ABAS -->
<div class="menu-perfil">

<button class="aba ativa" onclick="trocarAba('posts', event)">
    <i class="bi bi-grid"></i> Posts
</button>

<button class="aba" onclick="trocarAba('sobre', event)">
    <i class="bi bi-person"></i> Sobre
</button>

<button class="aba" onclick="trocarAba('fotos', event)">
    <i class="bi bi-image"></i> Fotos
</button>

</div>

<!-- CONTEÚDO -->
<div class="conteudos">

<div id="posts" class="conteudo ativo">
    <div class="post">Post do usuário aqui...</div>
</div>

<div id="sobre" class="conteudo">
    <p id="textoSobre">Informações do usuário...</p>
</div>

<div id="fotos" class="conteudo">

<div class="galeria">
    <img src="https://picsum.photos/200?1">
    <img src="https://picsum.photos/200?2">
    <img src="https://picsum.photos/200?3">
</div>

</div>

</div>

</main>

<!-- MODAL -->
<div class="modal" id="editorPerfil">

<div class="modal-box">

<h3>Editar perfil</h3>

<input id="nome" placeholder="Nome">

<textarea id="bio" placeholder="Bio"></textarea>

<button onclick="salvarPerfil()">Salvar</button>

<button onclick="fecharEditor()">Fechar</button>

</div>

</div>

<script>

// ============================
// PEGAR NOME SALVO
// ============================

const nomeUsuario = localStorage.getItem("nomeUsuario");

if(nomeUsuario){

    document.getElementById("nomePerfil").innerText = nomeUsuario;

    document.querySelector(".username").innerText =
    "@" + nomeUsuario.toLowerCase().replace(/\s/g, "");

}

// ============================
// TROCAR ABAS
// ============================

function trocarAba(id, event){

    document.querySelectorAll('.conteudo')
    .forEach(c => c.classList.remove('ativo'));

    document.querySelectorAll('.aba')
    .forEach(a => a.classList.remove('ativa'));

    document.getElementById(id)
    .classList.add('ativo');

    event.currentTarget.classList.add('ativa');
}

// ============================
// MODAL
// ============================

function abrirEditor(){

    document.getElementById("editorPerfil")
    .classList.add("ativo");
}

function fecharEditor(){

    document.getElementById("editorPerfil")
    .classList.remove("ativo");
}

// ============================
// SALVAR PERFIL
// ============================

function salvarPerfil(){

    let nome = document.getElementById("nome").value;

    let bio = document.getElementById("bio").value;

    // salva nome
    if(nome){

        localStorage.setItem("nomeUsuario", nome);

        document.getElementById("nomePerfil")
        .innerText = nome;

        document.querySelector(".username").innerText =
        "@" + nome.toLowerCase().replace(/\s/g, "");
    }

    // salva bio
    if(bio){

        localStorage.setItem("bioUsuario", bio);

        document.getElementById("bioPerfil")
        .innerText = bio;
    }

    fecharEditor();
}

// ============================
// CARREGAR BIO
// ============================

const bioSalva = localStorage.getItem("bioUsuario");

if(bioSalva){

    document.getElementById("bioPerfil")
    .innerText = bioSalva;
}

// ============================
// TROCAR FOTO
// ============================

document.getElementById("inputFoto")
.addEventListener("change", function(){

    let file = this.files[0];

    if(file){

        let leitor = new FileReader();

        leitor.onload = function(e){

            const imagem = e.target.result;

            document.getElementById("fotoPerfil").src = imagem;

            // salva foto
            localStorage.setItem("fotoUsuario", imagem);
        }

        leitor.readAsDataURL(file);
    }
});

// carregar foto salva
const fotoSalva = localStorage.getItem("fotoUsuario");

if(fotoSalva){

    document.getElementById("fotoPerfil").src = fotoSalva;
}

</script>

</body>
</html>
