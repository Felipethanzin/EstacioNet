<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Estácio Net</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="https://cdn-icons-png.flaticon.com/512/906/906175.png" alt="logo">
            <span>Estácio Net</span>
        </div>

        <div class="menu-toggle" id="mobile-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <nav class="menu" id="nav-menu">
            <a href="login.html">Login</a>
            <a href="../suporte/suporte.html">Suporte</a>
        </nav>
    </header>

    <main class="container">
        <section class="login-card">
            <h2>Bem-vindo</h2>
            <p style="font-size: 0.9rem; margin-bottom: 25px;">Acesse sua conta para continuar</p>
            
            <form class="form">
                <div class="input-group">
                    <input type="text" placeholder="Usuário" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Senha" required>
                </div>
                <button type="submit" class="btn-login">Entrar</button>
            </form>
            
            <div class="footer-card">
                <a href="#">Esqueceu a senha?</a>
                <span style="color: rgba(255,255,255,0.3)">|</span>
                <a href="../cadastro/cadastro.html">Criar conta</a>
            </div>
        </section>
    </main>

    <script>
        const menuToggle = document.getElementById('mobile-menu');
        const navMenu = document.getElementById('nav-menu');

        menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            navMenu.classList.toggle('active');
        });
    </script>
</body>
</html>
